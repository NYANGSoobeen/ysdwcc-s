# main에 올라가면 Firebase에 자동으로 배포한다. GitHub 저장소 → Actions 탭에서 직접 실행할 수도 있다.
# 처음 한 번, 저장소 Settings → Secrets and variables → Actions 에 FIREBASE_SERVICE_ACCOUNT(배포용 키 JSON)를 넣어야 동작한다.
name: Firebase 배포

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: 배포 키 확인
        id: key
        env:
          KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::FIREBASE_SERVICE_ACCOUNT가 없어 배포를 건너뜁니다. 저장소 Settings → Secrets 에 배포용 키를 넣으세요."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.key.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.key.outputs.ready == 'true'
        with:
          node-version: 22
          cache: npm

      - name: 설치
        if: steps.key.outputs.ready == 'true'
        run: |
          npm ci
          npm --prefix functions ci

      - name: 배포 (웹앱, 보안 규칙, 서버 함수)
        if: steps.key.outputs.ready == 'true'
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT" > "$RUNNER_TEMP/sa.json"
          export GOOGLE_APPLICATION_CREDENTIALS="$RUNNER_TEMP/sa.json"
          npx firebase deploy --project ysdwcc-s --non-interactive --force
          rm -f "$RUNNER_TEMP/sa.json"
