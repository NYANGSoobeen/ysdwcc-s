<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover: 아이폰 노치·홈 바 영역까지 쓰고 safe-area로 비켜 간다.
         interactive-widget=resizes-content: 갤럭시 크롬에서 키보드가 열리면 화면을 키보드 위로 줄인다. -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#16587b" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- 아이폰 홈 화면 아이콘 아래 이름 -->
    <meta name="apple-mobile-web-app-title" content="양산동원지원팀" />
    <!-- 파일 경로를 바꾸면 브라우저가 기억해 둔 옛 파비콘 대신 새 파일을 받는다 -->
    <link rel="icon" type="image/svg+xml" href="/icons/favicon.svg" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192.png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <!-- 글꼴: 본문 Noto Sans KR(400·500·700), 제목·화면 이름·내 이름 Noto Serif KR(500·700). 구글이 글자 범위별로 나눠 보내 필요한 만큼만 받는다. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700&family=Noto+Serif+KR:wght@500;700&display=swap" />
    <title>양산동원로얄CC지원팀</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
